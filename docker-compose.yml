services:
  # 1. Aplikasi Utama (PHP-FPM)
  app:
    build:
      context: .
    container_name: gudangumum-v.2.2
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - OPENSSL_CONF=/etc/ssl/openssl.cnf
    networks:
      - laravel_network

  # 2. Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network

  # 3. Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_gudangumum
      POSTGRES_USER: gudang_user
      POSTGRES_PASSWORD: gudang_passwordsecret
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - laravel_network

  # 4. Redis Service
  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - laravel_network

  # 5. Queue Worker
  queue_worker:
    image: php:8.4-fpm-alpine
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
